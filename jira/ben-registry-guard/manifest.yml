app:
  id: "ari:cloud:ecosystem::app/${APP_ID}"
  runtime:
    name: nodejs22.x

environment:
  variables:
    - APP_ID
    - BEN_REGISTRY_FIELD_KEY
    - BEN_REGISTRY_ISSUE_TYPE_ID
    - BEN_REGISTRY_MIGRATION_KEYS

modules:
  jira:customField:
    - key: ben-registry-record
      name: BEN Registry Record
      description: Canonical validated BEN registry metadata.
      type: object
      schema:
        properties:
          version:
            type: integer
          activityKind:
            type: string
          ideaCategory:
            type: string
          result:
            type: object
            properties:
              mode:
                type: string
              outcome:
                type: string
              scores:
                type: string
              signal:
                type: string
          sourceKey:
            type: string
        required:
          - version
      view:
        formatter:
          expression: "value == null ? '' : (value.activityKind == null ? 'Idea' : value.activityKind) + (value.sourceKey == null ? '' : ' · ' + value.sourceKey)"
      edit:
        experience:
          - issue-create
          - issue-view
        validation:
          expression: |-
            let r = value;
            let l = (issue == null || issue.id == null) ? 'Unused' : issue.status.name;
            let activities = ['candidate-evaluation', 'failure-evaluation', 'benchmark-testing', 'uiux-discovery'];
            let ideas = ['considered', 'fresh'];
            let lifecycles = ['Unused', 'Preparing', 'Blocked', 'Running', 'Completed', 'Retired'];
            let resultModes = ['unknown', 'summary'];
            let source = r != null && r.sourceKey != null ? new Issue(r.sourceKey) : null;
            let base = r != null && r.version == 1 && lifecycles.includes(l) && (r.activityKind == null || activities.includes(r.activityKind)) && (r.ideaCategory == null || ideas.includes(r.ideaCategory)) && (r.sourceKey == null || (source != null && source.project.key != 'BEN'));
            let resultShape = r == null || r.result == null || (resultModes.includes(r.result.mode) && (r.result.mode == 'unknown' ? r.result.outcome == null && r.result.scores == null && r.result.signal == null : r.result.outcome != null && r.result.outcome.trim().length > 0 && r.result.scores != null && r.result.scores.trim().length > 0 && r.result.signal != null && r.result.signal.trim().length > 0));
            let unused = l != 'Unused' || ((r.activityKind != null || r.ideaCategory != null) && r.result == null);
            let active = l == 'Unused' || (r.activityKind != null && r.ideaCategory == null);
            let resultOwner = r.result == null || r.activityKind == 'candidate-evaluation';
            let candidateCompleted = r.activityKind != 'candidate-evaluation' || l != 'Completed' || r.result != null;
            let candidateForbidden = r.activityKind != 'candidate-evaluation' || !['Unused', 'Retired'].includes(l) || r.result == null;
            base && resultShape && unused && active && resultOwner && candidateCompleted && candidateForbidden
          errorMessage: BEN Registry Record is invalid for the current lifecycle.

  jira:workflowValidator:
    - key: ben-registry-transition-validator
      name: BEN registry lifecycle validator
      description: Rejects lifecycle transitions whose destination state would violate the BEN registry contract.
      projectTypes:
        - team-managed
      expression: |-
        let r = issue['${BEN_REGISTRY_FIELD_KEY}'];
        let l = transition.to.name;
        let activities = ['candidate-evaluation', 'failure-evaluation', 'benchmark-testing', 'uiux-discovery'];
        let ideas = ['considered', 'fresh'];
        let lifecycles = ['Unused', 'Preparing', 'Blocked', 'Running', 'Completed', 'Retired'];
        let resultModes = ['unknown', 'summary'];
        let source = r != null && r.sourceKey != null ? new Issue(r.sourceKey) : null;
        let base = r != null && r.version == 1 && lifecycles.includes(l) && (r.activityKind == null || activities.includes(r.activityKind)) && (r.ideaCategory == null || ideas.includes(r.ideaCategory)) && (r.sourceKey == null || (source != null && source.project.key != 'BEN'));
        let resultShape = r == null || r.result == null || (resultModes.includes(r.result.mode) && (r.result.mode == 'unknown' ? r.result.outcome == null && r.result.scores == null && r.result.signal == null : r.result.outcome != null && r.result.outcome.trim().length > 0 && r.result.scores != null && r.result.scores.trim().length > 0 && r.result.signal != null && r.result.signal.trim().length > 0));
        let unused = l != 'Unused' || ((r.activityKind != null || r.ideaCategory != null) && r.result == null);
        let active = l == 'Unused' || (r.activityKind != null && r.ideaCategory == null);
        let resultOwner = r.result == null || r.activityKind == 'candidate-evaluation';
        let candidateCompleted = r.activityKind != 'candidate-evaluation' || l != 'Completed' || r.result != null;
        let candidateForbidden = r.activityKind != 'candidate-evaluation' || !['Unused', 'Retired'].includes(l) || r.result == null;
        base && resultShape && unused && active && resultOwner && candidateCompleted && candidateForbidden
      errorMessage: BEN registry state is invalid for the destination lifecycle.

  jira:actionValidator:
    - key: ben-registry-type-validator
      action: workItemTypeChanged
      expression: "newIssueType != '${BEN_REGISTRY_ISSUE_TYPE_ID}' || '${BEN_REGISTRY_MIGRATION_KEYS}'.split(',').includes(issue.key)"
      errorMessage: Conversion into the BEN registry work type is disabled outside the migration allowlist.

permissions:
  scopes:
    - read:jira-work
