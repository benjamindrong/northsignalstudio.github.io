<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Control</title>
  <link rel="icon" type="image/png" href="../icon.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #13171c;
      --panel-border: #262d35;
      --text: #f5f7fa;
      --muted: #8f99a6;
      --accent: #8bb8ff;
      --radius: 16px;
      --gap: 18px;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 680px;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: var(--gap);
      min-width: 0;
    }

    .widget {
      min-width: 0;
      min-height: 280px;
      padding: 20px;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .widget--tickets {
      grid-column: span 7;
    }

    .widget--github {
      grid-column: span 5;
    }

    .widget--recent {
      grid-column: 1 / -1;
      min-height: 220px;
    }

    .widget-header {
      padding-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .widget h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .widget-placeholder {
      display: grid;
      min-height: 190px;
      place-items: center;
      padding: 24px 12px;
      color: var(--muted);
      text-align: center;
    }

    .widget--recent .widget-placeholder {
      min-height: 140px;
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 24px, 1180px);
        padding-top: 28px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .widget--tickets,
      .widget--github,
      .widget--recent {
        grid-column: auto;
      }

      .widget {
        min-height: 220px;
      }

      .widget-placeholder,
      .widget--recent .widget-placeholder {
        min-height: 130px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">Homepage Dashboard</p>
      <h1>Flight Control</h1>
      <p class="subtitle">
        A lightweight view of current work across tickets and GitHub.
      </p>
    </header>

    <div class="dashboard-grid" aria-label="Dashboard widgets">
      <section class="widget widget--tickets" aria-labelledby="tickets-title">
        <header class="widget-header">
          <h2 id="tickets-title">Ticket Flight Control</h2>
        </header>
        <div class="widget-placeholder">
          <p>Active ticket work will appear here.</p>
        </div>
      </section>

      <section class="widget widget--github" aria-labelledby="github-title">
        <header class="widget-header">
          <h2 id="github-title">GitHub PRs</h2>
        </header>
        <div class="widget-placeholder">
          <p>Open pull requests will appear here.</p>
        </div>
      </section>

      <section class="widget widget--recent" aria-labelledby="recent-title">
        <header class="widget-header">
          <h2 id="recent-title">Recently Active</h2>
        </header>
        <div class="widget-placeholder">
          <p>Recently updated tickets and pull requests will appear here.</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
