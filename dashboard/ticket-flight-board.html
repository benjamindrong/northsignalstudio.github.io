<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticket Flight Board</title>
<link rel="icon" type="image/svg+xml" href="ticket-flight-board-icon.svg">
<link rel="apple-touch-icon" href="ticket-flight-board-icon.svg">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e100f;
    --panel: #151816;
    --panel-2: #101310;
    --line: #303630;
    --line-soft: #242a25;
    --text: #f1eddc;
    --muted: #9da59d;
    --todo: #b9d9ee;
    --progress: #ffd166;
    --review: #cdb4ff;
    --blocked: #ff786f;
    --done: #8fd694;
    --unknown: #d7d2c3;
    --focus: #fff1a8;
    --row-height: 38px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    min-width: 0;
    height: 100%;
    min-height: 260px;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    color: var(--text);
  }

  button, select, input { font: inherit; }

  .board {
    width: 100%;
    height: 100%;
    min-height: 260px;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--bg);
  }

  .topbar {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .title-wrap {
    min-width: 0;
    flex: 1 1 auto;
  }

  .title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 15px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: .085em;
    text-transform: uppercase;
  }

  .subtitle {
    margin-top: 5px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--muted);
    font-size: 8px;
    line-height: 1;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .project-control[hidden] { display: none; }

  .project-control select {
    max-width: 142px;
    height: 28px;
    border: 1px solid #697069;
    border-radius: 0;
    padding: 0 26px 0 7px;
    color: var(--text);
    background: var(--panel-2);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .picker {
    position: relative;
    height: 28px;
    min-width: 86px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #777e77;
    padding: 0 8px;
    color: var(--text);
    background: transparent;
    cursor: pointer;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .picker:hover { border-color: var(--text); }

  .picker:focus-within,
  .project-control select:focus-visible,
  .ticket-row:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .picker input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .columns,
  .ticket-row {
    display: grid;
    grid-template-columns: 74px minmax(120px, 1fr) minmax(90px, 124px) 108px;
    align-items: center;
    column-gap: 8px;
  }

  .columns {
    min-height: 24px;
    padding: 0 9px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 8px;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .rows {
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #4c544d transparent;
  }

  .rows::-webkit-scrollbar { width: 8px; }
  .rows::-webkit-scrollbar-track { background: transparent; }
  .rows::-webkit-scrollbar-thumb { background: #4c544d; }

  .ticket-row {
    position: relative;
    min-height: var(--row-height);
    padding: 0 9px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--bg);
    color: inherit;
    text-decoration: none;
    font-size: 10.5px;
    line-height: 1.1;
  }

  .ticket-row:nth-child(even) { background: #121512; }
  .ticket-row[data-clickable="true"] { cursor: pointer; }
  .ticket-row[data-clickable="true"]:hover { background: #181d19; }

  .ticket-row[data-attention="true"]::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--blocked);
  }

  .cell {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .key {
    font-weight: 900;
    color: #fff7d3;
  }

  .summary {
    font-weight: 700;
  }

  .extra {
    color: #c8c8bc;
  }

  .status {
    justify-self: stretch;
    min-width: 0;
    padding: 5px 5px 4px;
    border: 1px solid currentColor;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 9px;
    font-weight: 950;
    letter-spacing: .045em;
    text-transform: uppercase;
  }

  .status.todo { color: var(--todo); }
  .status.progress { color: var(--progress); }
  .status.review { color: var(--review); }
  .status.blocked { color: var(--blocked); }
  .status.done { color: var(--done); }
  .status.unknown { color: var(--unknown); }

  .empty {
    height: 100%;
    min-height: 150px;
    display: grid;
    place-items: center;
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: .045em;
    text-transform: uppercase;
  }

  .empty strong {
    display: block;
    margin-bottom: 4px;
    color: var(--text);
    font-size: 12px;
  }

  .footer {
    min-height: 25px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 9px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 8px;
    letter-spacing: .055em;
    text-transform: uppercase;
  }

  .source {
    min-width: 0;
    flex: 1 1 auto;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .counts {
    flex: 0 0 auto;
    max-width: 55%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: #cacbbf;
  }

  .error { color: var(--blocked); }

  .board[data-dragging="true"] {
    outline: 2px solid var(--progress);
    outline-offset: -3px;
  }

  @media (max-width: 560px) {
    .topbar { gap: 7px; }
    .title { font-size: 13px; }
    .subtitle { display: none; }
    .project-control select { max-width: 108px; }
    .columns,
    .ticket-row {
      grid-template-columns: 62px minmax(88px, 1fr) 96px;
      column-gap: 6px;
    }
    .columns .extra-head,
    .ticket-row .extra { display: none; }
    .ticket-row { font-size: 10px; }
  }

  @media (max-width: 410px) {
    .topbar {
      align-items: stretch;
      flex-wrap: wrap;
    }
    .title-wrap { width: 100%; flex-basis: 100%; }
    .toolbar { width: 100%; }
    .project-control { flex: 1 1 auto; min-width: 0; }
    .project-control select { width: 100%; max-width: none; }
    .picker { margin-left: auto; }
    .columns,
    .ticket-row {
      grid-template-columns: 54px minmax(72px, 1fr) 88px;
      padding-left: 7px;
      padding-right: 7px;
    }
    .status { font-size: 8px; }
  }
</style>
</head>
<body>
<main id="board" class="board" aria-label="Ticket flight board" data-dragging="false">
  <header class="topbar">
    <div class="title-wrap">
      <div class="title">Ticket Flight Board</div>
      <div class="subtitle">Drop CSV or JSON anywhere on the board</div>
    </div>
    <div class="toolbar">
      <label id="projectControl" class="project-control" hidden>
        <select id="projectFilter" aria-label="Filter by project"></select>
      </label>
      <label class="picker">
        Load file
        <input id="filePicker" type="file" accept=".csv,.json,text/csv,application/json" aria-label="Load ticket CSV or JSON file">
      </label>
    </div>
  </header>

  <div id="columns" class="columns" aria-hidden="true">
    <div>Ticket</div>
    <div>Work item</div>
    <div id="extraHead" class="extra-head">Updated</div>
    <div>Status</div>
  </div>

  <section id="rows" class="rows" aria-live="polite"></section>

  <footer class="footer">
    <div id="source" class="source">No file loaded</div>
    <div id="counts" class="counts"></div>
  </footer>
</main>

<script>
(() => {
  'use strict';

  const boardEl = document.getElementById('board');
  const rowsEl = document.getElementById('rows');
  const sourceEl = document.getElementById('source');
  const countsEl = document.getElementById('counts');
  const pickerEl = document.getElementById('filePicker');
  const projectControlEl = document.getElementById('projectControl');
  const projectFilterEl = document.getElementById('projectFilter');
  const extraHeadEl = document.getElementById('extraHead');

  let allTickets = [];
  let activeSource = 'No file loaded';
  let selectedProject = '';
  let extraField = 'updated';

  const clean = value => String(value ?? '').trim();
  const normalizedKey = value => clean(value).toLowerCase().replace(/[^a-z0-9]/g, '');

  const FIELD_ALIASES = {
    key: ['issuekey', 'key', 'ticketkey', 'ticket'],
    summary: ['summary', 'title', 'issuesummary'],
    status: ['status', 'issuestatus'],
    assignee: ['assignee', 'assignedto', 'assigneedisplayname'],
    issueType: ['issuetype', 'type', 'worktype'],
    updated: ['updated', 'updateddate', 'lastupdated', 'lastupdate'],
    project: ['project', 'projectname', 'projectkey'],
    url: ['url', 'issueurl', 'jiraurl', 'detailurl', 'weburl', 'link'],
    dueDate: ['duedate', 'due'],
    attention: ['attention', 'needsattention', 'flagged', 'flag']
  };

  function parseCSV(text) {
    const source = String(text || '').replace(/^\uFEFF/, '');
    const rows = [];
    let row = [];
    let field = '';
    let quoted = false;

    for (let i = 0; i < source.length; i += 1) {
      const ch = source[i];

      if (quoted) {
        if (ch === '"') {
          if (source[i + 1] === '"') {
            field += '"';
            i += 1;
          } else {
            quoted = false;
          }
        } else {
          field += ch;
        }
        continue;
      }

      if (ch === '"' && field.length === 0) {
        quoted = true;
      } else if (ch === ',') {
        row.push(field);
        field = '';
      } else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && source[i + 1] === '\n') i += 1;
        row.push(field);
        field = '';
        if (row.some(cell => clean(cell))) rows.push(row);
        row = [];
      } else {
        field += ch;
      }
    }

    if (quoted) throw new Error('CSV contains an unterminated quoted field.');

    if (field.length || row.length) {
      row.push(field);
      if (row.some(cell => clean(cell))) rows.push(row);
    }

    return rows;
  }

  function resolveHeader(headers, fieldName) {
    const aliases = FIELD_ALIASES[fieldName];
    for (const alias of aliases) {
      const index = headers.indexOf(alias);
      if (index !== -1) return index;
    }
    return -1;
  }

  function rowObjectFromCSV(headers, cells) {
    const get = fieldName => {
      const index = resolveHeader(headers, fieldName);
      return index >= 0 ? clean(cells[index]) : '';
    };

    return normalizeTicket({
      key: get('key'),
      summary: get('summary'),
      status: get('status'),
      assignee: get('assignee'),
      issueType: get('issueType'),
      updated: get('updated'),
      project: get('project'),
      url: get('url'),
      dueDate: get('dueDate'),
      attention: get('attention')
    });
  }

  function ticketsFromCSV(text) {
    const matrix = parseCSV(text);
    if (matrix.length < 2) throw new Error('CSV contains no ticket rows.');

    const headers = matrix[0].map(normalizedKey);
    if (resolveHeader(headers, 'key') === -1 && resolveHeader(headers, 'summary') === -1) {
      throw new Error('CSV must include an issue key or summary column.');
    }

    return matrix.slice(1)
      .map(cells => rowObjectFromCSV(headers, cells))
      .filter(ticket => ticket.key || ticket.summary || ticket.status);
  }

  function objectValue(object, names) {
    for (const name of names) {
      if (Object.prototype.hasOwnProperty.call(object, name) && object[name] != null) return object[name];
    }

    const normalized = new Map(Object.keys(object).map(key => [normalizedKey(key), object[key]]));
    for (const name of names) {
      const value = normalized.get(normalizedKey(name));
      if (value != null) return value;
    }
    return '';
  }

  function nestedName(value) {
    if (value && typeof value === 'object') {
      return clean(value.displayName || value.name || value.value || value.key || value.id);
    }
    return clean(value);
  }

  function normalizeJSONIssue(issue) {
    if (!issue || typeof issue !== 'object' || Array.isArray(issue)) return null;
    const fields = issue.fields && typeof issue.fields === 'object' ? issue.fields : issue;

    return normalizeTicket({
      key: clean(issue.key || objectValue(fields, ['Issue Key', 'issueKey', 'key', 'ticketKey'])),
      summary: clean(objectValue(fields, ['Summary', 'summary', 'title'])),
      status: nestedName(objectValue(fields, ['Status', 'status'])),
      assignee: nestedName(objectValue(fields, ['Assignee', 'assignee', 'assignedTo'])),
      issueType: nestedName(objectValue(fields, ['Issue Type', 'issueType', 'issuetype', 'type'])),
      updated: clean(objectValue(fields, ['Updated', 'updated', 'updatedDate', 'lastUpdated'])),
      project: nestedName(objectValue(fields, ['Project', 'project', 'projectName', 'projectKey'])),
      url: clean(issue.self || objectValue(fields, ['URL', 'url', 'issueUrl', 'jiraUrl', 'detailUrl', 'webUrl', 'link'])),
      dueDate: clean(objectValue(fields, ['Due Date', 'dueDate', 'duedate', 'due'])),
      attention: objectValue(fields, ['Attention', 'attention', 'Needs Attention', 'needsAttention', 'Flagged', 'flagged'])
    });
  }

  function ticketsFromJSON(text) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch {
      throw new Error('JSON file is not valid JSON.');
    }

    const records = Array.isArray(parsed)
      ? parsed
      : Array.isArray(parsed.issues)
        ? parsed.issues
        : Array.isArray(parsed.tickets)
          ? parsed.tickets
          : null;

    if (!records) throw new Error('JSON must be an array or contain an issues/tickets array.');

    return records.map(normalizeJSONIssue).filter(Boolean).filter(ticket => ticket.key || ticket.summary || ticket.status);
  }

  function canonicalStatus(status) {
    const value = clean(status);
    const lower = value.toLowerCase();
    if (!value) return { label: 'UNAVAILABLE', className: 'blocked', rank: 0 };
    if (/block|imped/.test(lower)) return { label: 'BLOCKED', className: 'blocked', rank: 0 };
    if (/review|approval/.test(lower)) return { label: 'IN REVIEW', className: 'review', rank: 1 };
    if (/in progress|progress|doing|active|started/.test(lower)) return { label: 'IN PROGRESS', className: 'progress', rank: 2 };
    if (/to do|todo|backlog|ready|open|new/.test(lower)) return { label: 'TO DO', className: 'todo', rank: 3 };
    if (/done|closed|complete|resolved|finished/.test(lower)) return { label: 'DONE', className: 'done', rank: 9 };
    return { label: value.toUpperCase(), className: 'unknown', rank: 4 };
  }

  function explicitAttentionReason(value) {
    if (typeof value === 'boolean') return value ? 'Flagged by source data' : '';
    const text = clean(value);
    if (!text || /^(false|no|none|0|ok|normal)$/i.test(text)) return '';
    if (/^(true|yes|1)$/i.test(text)) return 'Flagged by source data';
    return text;
  }

  function isOverdue(dueDate, statusInfo) {
    if (!clean(dueDate) || statusInfo.label === 'DONE') return false;
    const parsed = new Date(dueDate);
    if (Number.isNaN(parsed.getTime())) return false;
    const due = new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate()).getTime();
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    return due < today;
  }

  function normalizeTicket(raw) {
    const ticket = {
      key: clean(raw.key),
      summary: clean(raw.summary),
      status: clean(raw.status),
      assignee: clean(raw.assignee),
      issueType: clean(raw.issueType),
      updated: clean(raw.updated),
      project: clean(raw.project),
      url: clean(raw.url),
      dueDate: clean(raw.dueDate),
      attention: raw.attention
    };

    const statusInfo = canonicalStatus(ticket.status);
    const attentionReasons = [];
    if (!ticket.key) attentionReasons.push('Missing issue key');
    if (!ticket.summary) attentionReasons.push('Missing summary');
    if (!ticket.status) attentionReasons.push('Missing status');
    if (statusInfo.label === 'BLOCKED') attentionReasons.push('Blocked status');
    if (isOverdue(ticket.dueDate, statusInfo)) attentionReasons.push(`Overdue: ${ticket.dueDate}`);
    const explicitReason = explicitAttentionReason(ticket.attention);
    if (explicitReason) attentionReasons.push(explicitReason);

    return { ...ticket, statusInfo, attentionReasons };
  }

  function ticketNumber(key) {
    const match = clean(key).match(/(\d+)\s*$/);
    return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
  }

  function sortTickets(tickets) {
    return [...tickets].sort((a, b) => {
      const attentionDelta = Number(b.attentionReasons.length > 0) - Number(a.attentionReasons.length > 0);
      if (attentionDelta) return attentionDelta;
      return a.statusInfo.rank - b.statusInfo.rank
        || ticketNumber(a.key) - ticketNumber(b.key)
        || a.key.localeCompare(b.key)
        || a.summary.localeCompare(b.summary);
    });
  }

  function displayUpdated(value) {
    const text = clean(value);
    if (!text) return 'Unavailable';
    const date = new Date(text);
    if (Number.isNaN(date.getTime())) return text;
    return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' }).format(date);
  }

  function chooseExtraField(tickets) {
    const fields = [
      { key: 'updated', label: 'Updated', value: ticket => displayUpdated(ticket.updated), present: ticket => Boolean(ticket.updated) },
      { key: 'assignee', label: 'Assignee', value: ticket => ticket.assignee || 'Unavailable', present: ticket => Boolean(ticket.assignee) },
      { key: 'issueType', label: 'Type', value: ticket => ticket.issueType || 'Unavailable', present: ticket => Boolean(ticket.issueType) }
    ];

    const scored = fields
      .map((field, index) => ({ field, count: tickets.filter(field.present).length, index }))
      .filter(entry => entry.count > 0)
      .sort((a, b) => b.count - a.count || a.index - b.index);

    return scored.length ? scored[0].field : null;
  }

  function safeURL(value) {
    const raw = clean(value);
    if (!raw) return '';
    try {
      const url = new URL(raw, window.location.href);
      if (!['http:', 'https:'].includes(url.protocol)) return '';
      return url.href;
    } catch {
      return '';
    }
  }

  function appendCell(row, text, className) {
    const cell = document.createElement('div');
    cell.className = `cell ${className}`;
    cell.textContent = text || 'Unavailable';
    cell.title = text || 'Unavailable';
    row.appendChild(cell);
    return cell;
  }

  function uniqueProjects(tickets) {
    return [...new Set(tickets.map(ticket => ticket.project).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  }

  function configureProjectFilter(tickets) {
    const projects = uniqueProjects(tickets);
    projectFilterEl.replaceChildren();

    if (projects.length <= 1) {
      projectControlEl.hidden = true;
      selectedProject = '';
      return;
    }

    const all = document.createElement('option');
    all.value = '';
    all.textContent = 'All projects';
    projectFilterEl.appendChild(all);

    projects.forEach(project => {
      const option = document.createElement('option');
      option.value = project;
      option.textContent = project;
      projectFilterEl.appendChild(option);
    });

    if (!projects.includes(selectedProject)) selectedProject = '';
    projectFilterEl.value = selectedProject;
    projectControlEl.hidden = false;
  }

  function updateCounts(tickets) {
    const counts = new Map();
    tickets.forEach(ticket => counts.set(ticket.statusInfo.label, (counts.get(ticket.statusInfo.label) || 0) + 1));
    const ordered = [...counts.entries()].sort((a, b) => canonicalStatus(a[0]).rank - canonicalStatus(b[0]).rank || a[0].localeCompare(b[0]));
    countsEl.textContent = ordered.map(([status, count]) => `${status}: ${count}`).join(' / ');
  }

  function render() {
    rowsEl.replaceChildren();

    const visibleTickets = allTickets.filter(ticket => !selectedProject || ticket.project === selectedProject);
    const ordered = sortTickets(visibleTickets);
    const chosenExtra = chooseExtraField(ordered);
    extraField = chosenExtra ? chosenExtra.key : '';
    extraHeadEl.textContent = chosenExtra ? chosenExtra.label : '';
    extraHeadEl.style.visibility = chosenExtra ? 'visible' : 'hidden';

    if (!ordered.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = allTickets.length
        ? '<div><strong>No tickets in this project</strong>Select another project.</div>'
        : '<div><strong>Load ticket data</strong>Choose or drop a local CSV or JSON export.</div>';
      rowsEl.appendChild(empty);
      countsEl.textContent = '';
      sourceEl.className = 'source';
      sourceEl.textContent = activeSource;
      return;
    }

    ordered.forEach(ticket => {
      const url = safeURL(ticket.url);
      const row = document.createElement(url ? 'a' : 'div');
      row.className = 'ticket-row';
      row.dataset.attention = ticket.attentionReasons.length ? 'true' : 'false';
      row.dataset.clickable = url ? 'true' : 'false';
      if (url) {
        row.href = url;
        row.target = '_blank';
        row.rel = 'noopener noreferrer';
        row.setAttribute('aria-label', `${ticket.key || 'Ticket'}: ${ticket.summary || 'Unavailable'}; status ${ticket.statusInfo.label}; open details`);
      }
      if (ticket.attentionReasons.length) {
        row.title = `Attention: ${ticket.attentionReasons.join('; ')}`;
        row.setAttribute('aria-description', ticket.attentionReasons.join('; '));
      }

      appendCell(row, ticket.key, 'key');
      appendCell(row, ticket.summary, 'summary');

      const extraValue = chosenExtra ? chosenExtra.value(ticket) : '';
      const extra = appendCell(row, extraValue, 'extra');
      if (!chosenExtra) extra.style.visibility = 'hidden';

      const status = appendCell(row, ticket.statusInfo.label, `status ${ticket.statusInfo.className}`);
      status.setAttribute('aria-label', `Status: ${ticket.statusInfo.label}`);

      rowsEl.appendChild(row);
    });

    sourceEl.className = 'source';
    sourceEl.textContent = activeSource;
    updateCounts(ordered);
  }

  function applyTickets(tickets, sourceLabel) {
    if (!tickets.length) throw new Error('File contains no ticket records.');
    allTickets = tickets;
    activeSource = sourceLabel;
    configureProjectFilter(allTickets);
    render();
  }

  function showError(message) {
    sourceEl.className = 'source error';
    sourceEl.textContent = message;
  }

  async function loadFile(file) {
    if (!file) return;
    const lowerName = file.name.toLowerCase();
    if (!lowerName.endsWith('.csv') && !lowerName.endsWith('.json')) {
      showError('Use a .csv or .json file.');
      return;
    }

    try {
      const text = await file.text();
      const tickets = lowerName.endsWith('.json') ? ticketsFromJSON(text) : ticketsFromCSV(text);
      applyTickets(tickets, file.name);
    } catch (error) {
      showError(error instanceof Error ? error.message : 'Unable to load ticket data.');
    }
  }

  pickerEl.addEventListener('change', event => {
    const file = event.target.files && event.target.files[0];
    loadFile(file);
    event.target.value = '';
  });

  projectFilterEl.addEventListener('change', event => {
    selectedProject = event.target.value;
    render();
  });

  ['dragenter', 'dragover'].forEach(type => {
    boardEl.addEventListener(type, event => {
      event.preventDefault();
      boardEl.dataset.dragging = 'true';
    });
  });

  ['dragleave', 'drop'].forEach(type => {
    boardEl.addEventListener(type, event => {
      event.preventDefault();
      boardEl.dataset.dragging = 'false';
    });
  });

  boardEl.addEventListener('drop', event => {
    const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
    loadFile(file);
  });

  render();
})();
</script>
</body>
</html>
