name: HOME-6 Implementation

on:
  push:
    branches:
      - HOME-6-Add-combined-Recently-Active-widget
    paths:
      - ".github/home6-trigger.txt"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HOME-6 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: HOME-6-Add-combined-Recently-Active-widget
          fetch-depth: 0

      - name: Verify starting main identity
        run: git merge-base --is-ancestor 744f6685cf971d98e99c059c4909daeb4352cf37 HEAD

      - name: Apply HOME-6 production changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          jira_path = Path('scripts/refresh-jira-flight-control.mjs')
          jira = jira_path.read_text()
          jira_replacements = [
              ("fields: ['summary', 'status', 'project']", "fields: ['summary', 'status', 'project', 'updated']"),
              ("for (const field of ['key', 'summary', 'status', 'statusCategory', 'projectKey', 'projectName', 'url']) {", "for (const field of ['key', 'summary', 'status', 'statusCategory', 'projectKey', 'projectName', 'updatedAt', 'url']) {"),
              ("if (issue.lastMove != null && Number.isNaN(Date.parse(issue.lastMove))) throw new Error(`Invalid LAST MOVE value for ${issue.key}.`);", "if (issue.lastMove != null && Number.isNaN(Date.parse(issue.lastMove))) throw new Error(`Invalid LAST MOVE value for ${issue.key}.`);\n    if (Number.isNaN(Date.parse(issue.updatedAt))) throw new Error(`Invalid updatedAt value for ${issue.key}.`);"),
              ("projectName: issue.fields?.project?.name || issue.fields?.project?.key || '',\n    lastMove:", "projectName: issue.fields?.project?.name || issue.fields?.project?.key || '',\n    updatedAt: issue.fields?.updated || '',\n    lastMove:"),
          ]
          for old, new in jira_replacements:
              if jira.count(old) != 1:
                  raise SystemExit(f'unexpected Jira preimage for {old!r}: {jira.count(old)}')
              jira = jira.replace(old, new)
          jira_path.write_text(jira)

          page_path = Path('dashboard/index.html')
          page = page_path.read_text()

          old = """    .github-pr-state.unknown { color: var(--unknown); }\n\n    @media (min-width: 860px) and (min-height: 640px) {"""
          new = """    .github-pr-state.unknown { color: var(--unknown); }\n\n    .recent-board {\n      margin-top: 16px;\n      min-width: 0;\n      min-height: 0;\n      flex: 1 1 auto;\n      display: flex;\n      flex-direction: column;\n      overflow: hidden;\n      border: 1px solid var(--board-line);\n      background: var(--board-bg);\n      color: var(--board-text);\n      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n    }\n    .recent-meta { min-width: 0; min-height: 34px; display: flex; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--board-line); background: var(--board-panel); }\n    .recent-source { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #a8aea8; font-size: 9px; letter-spacing: .055em; text-transform: uppercase; }\n    #recentRows { min-height: 0; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }\n    .recent-row { min-width: 0; min-height: 48px; display: grid; grid-template-columns: 120px minmax(0, 1fr) 112px; align-items: center; column-gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--board-line-soft); color: inherit; text-decoration: none; }\n    .recent-row:nth-child(even) { background: #121512; }\n    .recent-row:hover { background: #181d19; }\n    .recent-identity, .recent-title, .recent-updated { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }\n    .recent-identity { color: #fff7d3; font-size: 9px; font-weight: 900; }\n    .recent-source-badge { margin-right: 5px; border: 1px solid currentColor; padding: 2px 3px 1px; font-size: 7px; font-weight: 950; letter-spacing: .04em; text-transform: uppercase; }\n    .recent-source-badge.jira { color: var(--accent); }\n    .recent-source-badge.github { color: var(--review); }\n    .recent-title { font-size: 11px; font-weight: 750; }\n    .recent-updated { color: #9da59d; text-align: right; font-size: 8px; letter-spacing: .03em; text-transform: uppercase; }\n    .recent-empty { display: grid; min-height: 100%; place-items: center; padding: 18px; color: #9da59d; text-align: center; font-size: 10px; line-height: 1.45; letter-spacing: .04em; text-transform: uppercase; }\n\n    @media (min-width: 860px) and (min-height: 640px) {"""
          if page.count(old) != 1:
              raise SystemExit('unexpected recent CSS insertion preimage')
          page = page.replace(old, new)

          old = """      .github-pr-row { min-height: 58px; padding-left: 6px; padding-right: 6px; column-gap: 5px; }\n      .github-pr-state { min-width: 68px; max-width: 76px; font-size: 7px; padding-left: 3px; padding-right: 3px; }"""
          new = """      .github-pr-row { min-height: 58px; padding-left: 6px; padding-right: 6px; column-gap: 5px; }\n      .github-pr-state { min-width: 68px; max-width: 76px; font-size: 7px; padding-left: 3px; padding-right: 3px; }\n      .recent-row { grid-template-columns: 86px minmax(0, 1fr) 72px; column-gap: 4px; padding-left: 6px; padding-right: 6px; }\n      .recent-source-badge { margin-right: 3px; font-size: 6px; padding-left: 2px; padding-right: 2px; }\n      .recent-identity { font-size: 8px; }\n      .recent-title { font-size: 10px; }\n      .recent-updated { font-size: 7px; }"""
          if page.count(old) != 1:
              raise SystemExit('unexpected narrow CSS preimage')
          page = page.replace(old, new)

          old = """      <section class=\"widget widget--recent\" aria-labelledby=\"recent-title\">\n        <header class=\"widget-header\"><h2 id=\"recent-title\">Recently Active</h2></header>\n        <div class=\"widget-placeholder\"><p>Recently updated tickets and pull requests will appear here.</p></div>\n      </section>"""
          new = """      <section class=\"widget widget--recent\" aria-labelledby=\"recent-title\">\n        <header class=\"widget-header\"><h2 id=\"recent-title\">Recently Active</h2></header>\n        <div class=\"recent-board\" aria-label=\"Recently active Jira and GitHub work\">\n          <div class=\"recent-meta\"><div id=\"recentSource\" class=\"recent-source\">Encrypted Jira + GitHub feeds</div></div>\n          <div id=\"recentRows\"><div class=\"recent-empty\">Unlock the dashboard to load recent activity.</div></div>\n        </div>\n      </section>"""
          if page.count(old) != 1:
              raise SystemExit('unexpected Recent Activity markup preimage')
          page = page.replace(old, new)

          old = """      const githubRowsEl = document.getElementById('githubRows');\n      const githubSourceEl = document.getElementById('githubSource');\n      const configPromises = new Map();"""
          new = """      const githubRowsEl = document.getElementById('githubRows');\n      const githubSourceEl = document.getElementById('githubSource');\n      const recentRowsEl = document.getElementById('recentRows');\n      const recentSourceEl = document.getElementById('recentSource');\n      const RECENT_ACTIVITY_LIMIT = 12;\n      const configPromises = new Map();"""
          if page.count(old) != 1:
              raise SystemExit('unexpected JS element preimage')
          page = page.replace(old, new)

          old = """      function renderGithubLocked(message = 'Unlock the dashboard to load pull requests.') {"""
          new = """      function recentTimestamp(value) {\n        const timestamp = Date.parse(value || '');\n        return Number.isNaN(timestamp) ? 0 : timestamp;\n      }\n\n      function recentActivityItems(jiraPayload, githubPayload) {\n        const jiraItems = (jiraPayload?.issues || []).map(issue => ({\n          source: 'JIRA',\n          identity: issue.key || 'Issue',\n          title: issue.summary || 'Untitled issue',\n          updatedAt: issue.updatedAt || issue.lastMove || '',\n          url: issue.url || ''\n        }));\n        const githubItems = (githubPayload?.pullRequests || [])\n          .filter(pull => String(pull.state || '').toUpperCase() !== 'DRAFT')\n          .map(pull => {\n            const repository = String(pull.repository || 'Repository').split('/').pop() || 'Repository';\n            return {\n              source: 'GITHUB',\n              identity: `${repository} #${pull.number}`,\n              title: pull.title || 'Untitled pull request',\n              updatedAt: pull.updatedAt || '',\n              url: pull.url || ''\n            };\n          });\n\n        return [...jiraItems, ...githubItems]\n          .filter(item => item.url && recentTimestamp(item.updatedAt) > 0)\n          .sort((a, b) => recentTimestamp(b.updatedAt) - recentTimestamp(a.updatedAt) || a.source.localeCompare(b.source) || a.identity.localeCompare(b.identity))\n          .slice(0, RECENT_ACTIVITY_LIMIT);\n      }\n\n      function appendRecentRow(item) {\n        const row = document.createElement('a');\n        row.className = 'recent-row';\n        row.href = item.url;\n        row.target = '_blank';\n        row.rel = 'noopener noreferrer';\n        row.setAttribute('aria-label', `${item.source} ${item.identity}: ${item.title}; updated ${formatDateTime(item.updatedAt)}`);\n\n        const identity = document.createElement('div');\n        identity.className = 'recent-identity';\n        const badge = document.createElement('span');\n        badge.className = `recent-source-badge ${item.source.toLowerCase()}`;\n        badge.textContent = item.source;\n        identity.appendChild(badge);\n        identity.append(document.createTextNode(item.identity));\n        identity.title = `${item.source} · ${item.identity}`;\n        row.appendChild(identity);\n\n        const title = document.createElement('div');\n        title.className = 'recent-title';\n        title.textContent = item.title;\n        title.title = item.title;\n        row.appendChild(title);\n\n        const updated = document.createElement('div');\n        updated.className = 'recent-updated';\n        updated.textContent = formatDateTime(item.updatedAt);\n        updated.title = item.updatedAt;\n        row.appendChild(updated);\n\n        recentRowsEl.appendChild(row);\n      }\n\n      function renderRecent(jiraPayload, githubPayload) {\n        recentRowsEl.replaceChildren();\n        const items = recentActivityItems(jiraPayload, githubPayload);\n        for (const item of items) appendRecentRow(item);\n        if (!items.length) {\n          const empty = document.createElement('div');\n          empty.className = 'recent-empty';\n          empty.textContent = 'No recent Jira or GitHub activity is available.';\n          recentRowsEl.appendChild(empty);\n        }\n        recentSourceEl.textContent = githubPayload ? 'Jira + GitHub · most recently updated' : 'Jira · GitHub feed unavailable';\n      }\n\n      function renderRecentLocked() {\n        recentRowsEl.innerHTML = '<div class=\"recent-empty\">Unlock the dashboard to load recent activity.</div>';\n        recentSourceEl.textContent = 'Encrypted Jira + GitHub feeds';\n      }\n\n      function renderGithubLocked(message = 'Unlock the dashboard to load pull requests.') {"""
          if page.count(old) != 1:
              raise SystemExit('unexpected Recent Activity JS insertion preimage')
          page = page.replace(old, new)

          old = """        lockEl.hidden = true;\n        renderGithubLocked();"""
          new = """        lockEl.hidden = true;\n        renderGithubLocked();\n        renderRecentLocked();"""
          if page.count(old) != 1:
              raise SystemExit('unexpected locked-state preimage')
          page = page.replace(old, new)

          old = """          renderGithubLocked(message);\n        }\n      }"""
          new = """          renderGithubLocked(message);\n        }\n\n        renderRecent(jiraResult.value, githubResult.status === 'fulfilled' ? githubResult.value : null);\n      }"""
          if page.count(old) != 1:
              raise SystemExit('unexpected unlock Recent Activity preimage')
          page = page.replace(old, new)

          page_path.write_text(page)
          PY

      - name: Run focused self-tests
        run: |
          node scripts/refresh-jira-flight-control.mjs --self-test
          node scripts/refresh-github-prs.mjs --self-test
          git diff --check

      - name: Verify Recently Active browser behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import json
          import re
          import shutil
          import subprocess
          import tempfile

          chrome = next((p for p in ('google-chrome', 'chromium', 'chromium-browser') if shutil.which(p)), None)
          if not chrome:
              raise SystemExit('Chrome/Chromium unavailable')

          source = Path('dashboard/index.html').read_text()
          expose = "window.__home6 = { renderRecent, recentActivityItems };\n      document.getElementById('unlockForm').addEventListener('submit', onUnlock);"
          marker = "document.getElementById('unlockForm').addEventListener('submit', onUnlock);"
          if source.count(marker) != 1:
              raise SystemExit('unexpected HOME-6 exposure preimage')
          source = source.replace(marker, expose, 1)

          sample = '''<script>
          window.__home6.renderRecent(
            { issues: [
              { key: 'HOME-6', summary: 'Newest Jira item', updatedAt: '2026-08-13T20:00:00Z', lastMove: '2026-08-13T18:00:00Z', url: 'https://example.test/jira/HOME-6' },
              { key: 'MYR-1', summary: 'Older Jira item', updatedAt: '2026-08-13T18:00:00Z', url: 'https://example.test/jira/MYR-1' }
            ] },
            { pullRequests: [
              { repository: 'benjamindrong/Runline', number: 9, title: 'Middle GitHub item', updatedAt: '2026-08-13T19:00:00Z', url: 'https://example.test/github/9', state: 'OPEN' },
              { repository: 'benjamindrong/MyRAM-iOS', number: 10, title: 'Hidden draft', updatedAt: '2026-08-13T21:00:00Z', url: 'https://example.test/github/10', state: 'DRAFT' }
            ] }
          );
          document.documentElement.setAttribute('data-home6-order', JSON.stringify([...document.querySelectorAll('.recent-row')].map(row => ({ text: row.textContent, href: row.href }))));
          </script>'''
          source = source.replace('</body>', sample + '\n</body>', 1)

          with tempfile.TemporaryDirectory() as tmp:
              page = Path(tmp) / 'index.html'
              page.write_text(source)
              for width in (320, 470, 859, 860, 1440):
                  proc = subprocess.run([
                      chrome, '--headless=new', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage', '--no-first-run',
                      f'--window-size={width},900', '--dump-dom', page.as_uri()
                  ], check=True, capture_output=True, text=True, timeout=30)
                  match = re.search(r'data-home6-order="([^"]+)"', proc.stdout)
                  if not match:
                      raise SystemExit(f'HOME-6 output missing at {width}px')
                  rows = json.loads(html.unescape(match.group(1)))
                  expected = ['HOME-6', 'Runline #9', 'MYR-1']
                  if len(rows) != 3 or any(expected[i] not in rows[i]['text'] for i in range(3)):
                      raise SystemExit(f'wrong Recent Activity order/content at {width}px: {rows}')
                  if any('Hidden draft' in row['text'] for row in rows):
                      raise SystemExit(f'draft PR leaked into Recent Activity at {width}px')
                  if [row['href'] for row in rows] != ['https://example.test/jira/HOME-6', 'https://example.test/github/9', 'https://example.test/jira/MYR-1']:
                      raise SystemExit(f'wrong Recent Activity links at {width}px: {rows}')
                  scroll_match = re.search(r'<html[^>]*', proc.stdout)
                  if not scroll_match:
                      raise SystemExit('missing html root')
                  print(width, rows)
          PY

      - name: Commit HOME-6 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html scripts/refresh-jira-flight-control.mjs
          git commit -m "HOME-6 Add combined Recently Active widget"
          git push origin HEAD:HOME-6-Add-combined-Recently-Active-widget
