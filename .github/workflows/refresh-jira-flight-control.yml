name: Refresh Flight Control

on:
  pull_request:
    paths:
      - "dashboard/index.html"
      - "dashboard/work-items.js"
      - "dashboard/work-relationships.js"
      - "dashboard/display.html"
      - "dashboard/benchmark-review.js"
      - "dashboard/refresh-health.js"
      - "dashboard/jira-flight-control.config.json"
      - "scripts/benchmark-registry.mjs"
      - "scripts/test-benchmark-registry.mjs"
      - "scripts/test-benchmark-review-presentation.mjs"
      - "scripts/test-home24-hardening.mjs"
      - "scripts/test-dashboard-refresh.mjs"
      - "scripts/test-dashboard-theme.mjs"
      - "scripts/test-dashboard-work-items.mjs"
      - "scripts/test-dashboard-work-relationships.mjs"
      - "scripts/test-dashboard-work-items-browser.mjs"
      - "scripts/test-dashboard-work-items-browser.py"
      - "scripts/refresh-jira-flight-control.mjs"
      - ".github/workflows/refresh-jira-flight-control.yml"
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      trigger_kind:
        description: "Refresh trigger kind"
        required: false
        default: "manual"
        type: choice
        options:
          - "manual"
          - "jira"
  push:
    branches: [main]
    paths:
      - "dashboard/index.html"
      - "dashboard/work-items.js"
      - "dashboard/work-relationships.js"
      - "dashboard/display.html"
      - "dashboard/benchmark-review.js"
      - "dashboard/refresh-health.js"
      - "dashboard/jira-flight-control.config.json"
      - "scripts/benchmark-registry.mjs"
      - "scripts/test-benchmark-registry.mjs"
      - "scripts/test-benchmark-review-presentation.mjs"
      - "scripts/test-home24-hardening.mjs"
      - "scripts/test-dashboard-refresh.mjs"
      - "scripts/test-dashboard-theme.mjs"
      - "scripts/test-dashboard-work-items.mjs"
      - "scripts/test-dashboard-work-relationships.mjs"
      - "scripts/test-dashboard-work-items-browser.mjs"
      - "scripts/test-dashboard-work-items-browser.py"
      - "scripts/refresh-jira-flight-control.mjs"
      - ".github/workflows/refresh-jira-flight-control.yml"

permissions:
  contents: read

concurrency:
  group: jira-flight-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify refresh logic
        run: |
          node --check dashboard/work-items.js
          node --check dashboard/work-relationships.js
          node --check scripts/test-dashboard-work-items.mjs
          node --check scripts/test-dashboard-work-items-browser.mjs
          node --check scripts/test-dashboard-theme.mjs
          node --check scripts/benchmark-registry.mjs
          node --check scripts/refresh-jira-flight-control.mjs
          node scripts/test-benchmark-registry.mjs
          node scripts/test-benchmark-review-presentation.mjs
          node scripts/test-home24-hardening.mjs
          node scripts/test-dashboard-work-items.mjs
          node scripts/test-dashboard-work-relationships.mjs
          node scripts/test-dashboard-theme.mjs
          node scripts/refresh-jira-flight-control.mjs --self-test
          node scripts/test-dashboard-refresh.mjs

      - name: Verify HOME-29 production-path browser behavior
        run: node scripts/test-dashboard-work-items-browser.mjs

      - name: Verify Benchmark Review UI seams
        run: |
          node --check dashboard/benchmark-review.js
          node --check dashboard/refresh-health.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const display = fs.readFileSync('dashboard/display.html', 'utf8');
          const health = fs.readFileSync('dashboard/refresh-health.js', 'utf8');
          const benchmark = fs.readFileSync('dashboard/benchmark-review.js', 'utf8');
          const required = [
            [display, 'data-view="3"', 'Benchmark Review Display Mode button'],
            [display, "selector: '.widget--benchmark'", 'Benchmark Review Display Mode selector'],
            [display, '.benchmark-board', 'Benchmark Review focused sizing'],
            [display, 'MutationObserver', 'dynamic widget Display Mode guard'],
            [health, "script.src = './benchmark-review.js'", 'Benchmark Review loader'],
            [health, 'renderBenchmarkReview', 'standalone native Benchmark Review renderer'],
            [fs.readFileSync('dashboard/native-benchmark-review.js', 'utf8'), 'projectNativeReview', 'native publication adapter'],
            [benchmark, "run.status === 'Running'", 'running-only active benchmark grouping'],
            [benchmark, "run.status === 'Preparing'", 'preparing benchmark On Deck grouping'],
            [benchmark, "run.status === 'Blocked'", 'blocked benchmark grouping'],
            [benchmark, 'orderedNextRuns', 'BEN-21-only next projection'],
            [benchmark, 'orderedOnDeckRuns', 'non-selected Preparing On Deck projection'],
            [benchmark, 'Next pointer unavailable:', 'visible BEN-21 pointer failure'],
            [benchmark, 'benchmark-columns completed-only', 'completed-only full-width layout'],
            [benchmark, 'registry.sourceLabel', 'registry source metadata'],
            [benchmark, "run.activityKind === 'benchmark-testing'", 'Application Testing result distinction'],
            [benchmark, 'Defined unused benchmarks', 'defined-unused registry distinction']
          ];
          for (const [source, marker, label] of required) {
            if (!source.includes(marker)) throw new Error(`Missing ${label}`);
          }
          console.log('Benchmark Review UI seam checks passed');
          NODE

      - name: Verify native Benchmark Review browser states
        run: |
          node --check dashboard/native-benchmark-review.js
          node scripts/test-native-benchmark-review.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const projectId = '22222222-2222-4222-8222-222222222222';
          const ids = [...Array(7)].map((_, i) =>
            `11111111-1111-4111-8111-${String(i + 1).padStart(12, '0')}`);
          const stamp = Date.parse('2026-10-10T15:00:00.000Z');
          const native = {
            version: 1, authority: 'dashboard-native-benchmark-review',
            generatedAt: new Date(stamp).toISOString(), nativeProjectionSha256: 'a'.repeat(64),
            registry: {projectId, selectedNextTicketId: null, selectedNextLegacyDisplayKey: null},
            records: ids.map((ticketId, i) => ({
              ticketId, summary: 'Completed review ' + (i + 1), lifecycle: 'Completed',
              activityKind: 'candidate-evaluation', ideaCategory: null,
              legacyDisplayKey: i === 0 ? 'BEN-14' : null, legacySourceKey: null,
              sourceTicketId: null, result: {kind: 'unknown'}, notableFinding: null,
              completedAtEpochMillis: String(stamp - i * 60000),
            })),
            completedOrder: ids,
          };
          const data = JSON.stringify(native);
          const page = `<!doctype html><html><head><meta charset="utf-8"></head><body>
            <div class="dashboard-grid"></div>
            <script src="./native-benchmark-review.js"></` + `script>
            <script src="./benchmark-review.js"></` + `script>
            <script>const value=${data};
              DashboardBenchmarkReview.render(
                DashboardNativeBenchmarkReview.projectNativeReview(value,{
                  expectedProjectId:'${projectId}', now:${stamp}
                }));
              document.querySelectorAll('script').forEach(node => node.remove());
            </` + `script></body></html>`;
          fs.writeFileSync('dashboard/.native-benchmark-acceptance.html', page);
          NODE
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/dashboard-native-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f dashboard/.native-benchmark-acceptance.html' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/dashboard/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --virtual-time-budget=1500 --dump-dom http://127.0.0.1:8000/dashboard/.native-benchmark-acceptance.html >/tmp/dashboard-native-benchmark-dom.html
          grep -F 'Dashboard-native Benchmark Review' /tmp/dashboard-native-benchmark-dom.html
          grep -F 'Completed · 7' /tmp/dashboard-native-benchmark-dom.html
          grep -F 'Show all 7' /tmp/dashboard-native-benchmark-dom.html
          grep -F 'BEN-14 · Completed review 1' /tmp/dashboard-native-benchmark-dom.html
          grep -F 'Native ticket:' /tmp/dashboard-native-benchmark-dom.html
          if grep -F 'Jira-native BEN registry' /tmp/dashboard-native-benchmark-dom.html; then exit 1; fi

      - name: Verify candidate diff
        run: |
          git fetch --no-tags origin main
          git diff --check FETCH_HEAD...HEAD

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: dashboard-data-publish
      cancel-in-progress: false
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out encrypted data branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dashboard-data
          path: _dashboard-data

      - name: Refresh and verify Jira Flight Control snapshot
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DASHBOARD_DATA_PASSPHRASE: ${{ secrets.DASHBOARD_DATA_PASSPHRASE }}
          PREVIOUS_PATH: _dashboard-data/dashboard/jira-flight-control.enc.json
          OUTPUT_PATH: _dashboard-data/dashboard/jira-flight-control.enc.json
          REFRESH_TRIGGER_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_kind || github.event_name }}
        run: |
          set -euo pipefail
          set +x
          node scripts/refresh-jira-flight-control.mjs
          node scripts/refresh-jira-flight-control.mjs --verify-output "$OUTPUT_PATH"

      - name: Publish changed Jira Flight Control snapshot
        working-directory: _dashboard-data
        env:
          DASHBOARD_DATA_PASSPHRASE: ${{ secrets.DASHBOARD_DATA_PASSPHRASE }}
          CONFIG_PATH: ../dashboard/jira-flight-control.config.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          owned_path=dashboard/jira-flight-control.enc.json
          sibling_path=dashboard/github-prs.enc.json
          baseline_owned_blob="$(git rev-parse "HEAD:$owned_path" 2>/dev/null || printf '<missing>')"
          git add "$owned_path"
          if git diff --cached --quiet; then
            echo "No Jira Flight Control changes."
            exit 0
          fi
          git commit -m "Refresh Jira Flight Control data"
          git fetch --no-tags origin dashboard-data
          remote_owned_blob="$(git rev-parse "FETCH_HEAD:$owned_path" 2>/dev/null || printf '<missing>')"
          if [ "$remote_owned_blob" != "$baseline_owned_blob" ]; then
            echo "dashboard-data $owned_path moved after acquisition; refusing to replay stale Jira state."
            exit 1
          fi
          git rebase FETCH_HEAD
          test -f "$owned_path"
          test -f "$sibling_path"
          node ../scripts/refresh-jira-flight-control.mjs --verify-output "$owned_path"
          git push origin HEAD:dashboard-data
