name: Refresh Flight Control

on:
  pull_request:
    paths:
      - "dashboard/index.html"
      - "dashboard/display.html"
      - "dashboard/benchmark-review.js"
      - "dashboard/jira-flight-control.config.json"
      - "scripts/benchmark-registry.mjs"
      - "scripts/refresh-jira-flight-control.mjs"
      - ".github/workflows/refresh-jira-flight-control.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/index.html"
      - "dashboard/display.html"
      - "dashboard/benchmark-review.js"
      - "dashboard/jira-flight-control.config.json"
      - "scripts/benchmark-registry.mjs"
      - "scripts/refresh-jira-flight-control.mjs"
      - ".github/workflows/refresh-jira-flight-control.yml"

permissions:
  contents: read

concurrency:
  group: jira-flight-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify refresh logic
        run: node scripts/refresh-jira-flight-control.mjs --self-test

      - name: Verify candidate diff
        run: |
          git fetch --no-tags origin main
          git diff --check FETCH_HEAD...HEAD

      - name: Verify live Jira refresh for trusted owner PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor == github.repository_owner
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DASHBOARD_DATA_PASSPHRASE: ${{ secrets.DASHBOARD_DATA_PASSPHRASE }}
          OUTPUT_PATH: /tmp/jira-flight-control.enc.json
          VERIFY_PROJECTS: MYR,LAN
          VERIFY_BENCHMARK_REGISTRY: BEN-8
        run: |
          node scripts/refresh-jira-flight-control.mjs
          node scripts/refresh-jira-flight-control.mjs --verify-output "$OUTPUT_PATH"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out encrypted data branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dashboard-data
          path: _dashboard-data

      - name: Refresh and verify encrypted Jira snapshot
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DASHBOARD_DATA_PASSPHRASE: ${{ secrets.DASHBOARD_DATA_PASSPHRASE }}
          PREVIOUS_PATH: _dashboard-data/dashboard/jira-flight-control.enc.json
          OUTPUT_PATH: _dashboard-data/dashboard/jira-flight-control.enc.json
        run: |
          node scripts/refresh-jira-flight-control.mjs
          node scripts/refresh-jira-flight-control.mjs --verify-output "$OUTPUT_PATH"

      - name: Publish changed snapshot
        working-directory: _dashboard-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/jira-flight-control.enc.json
          if git diff --cached --quiet; then
            echo "No Jira Flight Control changes."
            exit 0
          fi
          git commit -m "Refresh Jira Flight Control data"
          git push origin HEAD:dashboard-data
