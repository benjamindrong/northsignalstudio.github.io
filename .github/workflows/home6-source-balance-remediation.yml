name: HOME-6 Source Balance Remediation

on:
  push:
    branches:
      - HOME-6-Add-combined-Recently-Active-widget
    paths:
      - ".github/home6-source-balance-trigger-v2.txt"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: HOME-6-Add-combined-Recently-Active-widget
          fetch-depth: 0

      - name: Apply narrow HOME-6 remediation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('dashboard/index.html')
          source = path.read_text()
          replacement = "\n".join([
              "      function recentActivityCompare(a, b) {",
              "        return recentTimestamp(b.updatedAt) - recentTimestamp(a.updatedAt)",
              "          || a.source.localeCompare(b.source)",
              "          || a.identity.localeCompare(b.identity);",
              "      }",
              "",
              "      function recentActivityItems(jiraPayload, githubPayload) {",
              "        const jiraItems = (jiraPayload?.issues || []).map(issue => ({",
              "          source: 'JIRA', identity: issue.key || 'Issue', title: issue.summary || 'Untitled issue',",
              "          updatedAt: issue.updatedAt || issue.lastMove || '', url: issue.url || ''",
              "        }));",
              "        const githubItems = (githubPayload?.pullRequests || [])",
              "          .filter(pull => String(pull.state || '').toUpperCase() !== 'DRAFT')",
              "          .map(pull => {",
              "            const repository = String(pull.repository || 'Repository').split('/').pop() || 'Repository';",
              "            return { source: 'GITHUB', identity: `${repository} #${pull.number}`, title: pull.title || 'Untitled pull request', updatedAt: pull.updatedAt || '', url: pull.url || '' };",
              "          });",
              "        const ordered = [...jiraItems, ...githubItems]",
              "          .filter(item => item.url && recentTimestamp(item.updatedAt) > 0)",
              "          .sort(recentActivityCompare);",
              "        const selected = ordered.slice(0, RECENT_ACTIVITY_LIMIT);",
              "        const availableSources = new Set(ordered.map(item => item.source));",
              "",
              "        if (availableSources.size > 1 && selected.length === RECENT_ACTIVITY_LIMIT) {",
              "          for (const source of availableSources) {",
              "            if (selected.some(item => item.source === source)) continue;",
              "            const representative = ordered.find(item => item.source === source);",
              "            if (representative) selected[selected.length - 1] = representative;",
              "          }",
              "          selected.sort(recentActivityCompare);",
              "        }",
              "        return selected;",
              "      }",
              "",
          ])
          pattern = r"      function recentActivityItems\(jiraPayload, githubPayload\) \{\n.*?\n      \}\n\n(?=      function appendRecentRow)"
          updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'unexpected HOME-6 recentActivityItems match count: {count}')
          path.write_text(updated)
          PY

      - name: Run focused regression and static checks
        run: |
          node scripts/refresh-jira-flight-control.mjs --self-test
          node scripts/refresh-github-prs.mjs --self-test
          git diff --check
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dashboard/index.html', 'utf8');
          const match = html.match(/function recentTimestamp\(value\) \{[\s\S]*?(?=\n      function appendRecentRow)/);
          if (!match) throw new Error('HOME-6 activity function block missing');
          const factory = new Function(`${'const RECENT_ACTIVITY_LIMIT = 12;'}\n${match[0]}\nreturn recentActivityItems;`);
          const recentActivityItems = factory();
          const jiraNewer = Array.from({length: 12}, (_, index) => ({
            key: `HOME-${index + 1}`,
            summary: `Jira ${index + 1}`,
            updatedAt: `2026-08-13T${String(23 - index).padStart(2, '0')}:00:00Z`,
            url: `https://example.test/jira/${index + 1}`
          }));
          const githubNewer = Array.from({length: 12}, (_, index) => ({
            repository: 'benjamindrong/Repo',
            number: index + 1,
            title: `GitHub ${index + 1}`,
            updatedAt: `2026-08-13T${String(23 - index).padStart(2, '0')}:00:00Z`,
            url: `https://example.test/github/${index + 1}`,
            state: 'OPEN'
          }));
          const jiraCrowd = recentActivityItems(
            {issues: jiraNewer},
            {pullRequests: [{repository: 'benjamindrong/Repo', number: 99, title: 'Older GitHub', updatedAt: '2026-08-12T12:00:00Z', url: 'https://example.test/github/99', state: 'OPEN'}]}
          );
          const githubCrowd = recentActivityItems(
            {issues: [{key: 'HOME-99', summary: 'Older Jira', updatedAt: '2026-08-12T12:00:00Z', url: 'https://example.test/jira/99'}]},
            {pullRequests: githubNewer}
          );
          for (const [label, items] of [['jira-crowd', jiraCrowd], ['github-crowd', githubCrowd]]) {
            if (items.length !== 12) throw new Error(`${label} exceeded or missed the 12-row cap`);
            const sources = new Set(items.map(item => item.source));
            if (!sources.has('JIRA') || !sources.has('GITHUB')) throw new Error(`${label} starved one source: ${[...sources]}`);
            for (let i = 1; i < items.length; i += 1) {
              if (Date.parse(items[i - 1].updatedAt) < Date.parse(items[i].updatedAt)) throw new Error(`${label} lost descending recency order`);
            }
          }
          console.log('HOME-6 source balance regression passed');
          NODE

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git commit -m "HOME-6 Preserve both Recent Activity sources"
          git push origin HEAD:HOME-6-Add-combined-Recently-Active-widget
