name: HOME-6 Source Balance Remediation

on:
  push:
    branches:
      - HOME-6-Add-combined-Recently-Active-widget
    paths:
      - ".github/home6-source-balance-trigger-v3.txt"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: HOME-6-Add-combined-Recently-Active-widget
          fetch-depth: 0

      - name: Apply narrow HOME-6 remediation
        run: |
          python3 -c "from pathlib import Path; import base64,re; p=Path('dashboard/index.html'); s=p.read_text(); r=base64.b64decode('').decode(); pattern=r'      function recentActivityItems\(jiraPayload, githubPayload\) \{\n.*?\n      \}\n\n(?=      function appendRecentRow)'; u,n=re.subn(pattern,r,s,count=1,flags=re.S); assert n==1, n; p.write_text(u)"

      - name: Run focused regression and static checks
        run: |
          node scripts/refresh-jira-flight-control.mjs --self-test
          node scripts/refresh-github-prs.mjs --self-test
          git diff --check
          cat > /tmp/home6-source-balance-test.js <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dashboard/index.html', 'utf8');
          const match = html.match(/function recentTimestamp\(value\) \{[\s\S]*?(?=\n      function appendRecentRow)/);
          if (!match) throw new Error('HOME-6 activity function block missing');
          const recentActivityItems = new Function(`const RECENT_ACTIVITY_LIMIT = 12;\n${match[0]}\nreturn recentActivityItems;`)();
          const jiraNewer = Array.from({length: 12}, (_, i) => ({key:`HOME-${i+1}`,summary:`Jira ${i+1}`,updatedAt:`2026-08-13T${String(23-i).padStart(2,'0')}:00:00Z`,url:`https://example.test/jira/${i+1}`}));
          const githubNewer = Array.from({length: 12}, (_, i) => ({repository:'benjamindrong/Repo',number:i+1,title:`GitHub ${i+1}`,updatedAt:`2026-08-13T${String(23-i).padStart(2,'0')}:00:00Z`,url:`https://example.test/github/${i+1}`,state:'OPEN'}));
          const cases = [
            ['jira-crowd', recentActivityItems({issues:jiraNewer},{pullRequests:[{repository:'benjamindrong/Repo',number:99,title:'Older GitHub',updatedAt:'2026-08-12T12:00:00Z',url:'https://example.test/github/99',state:'OPEN'}]})],
            ['github-crowd', recentActivityItems({issues:[{key:'HOME-99',summary:'Older Jira',updatedAt:'2026-08-12T12:00:00Z',url:'https://example.test/jira/99'}]},{pullRequests:githubNewer})]
          ];
          for (const [label, items] of cases) {
            if (items.length !== 12) throw new Error(`${label}: expected 12 rows`);
            const sources = new Set(items.map(item => item.source));
            if (!sources.has('JIRA') || !sources.has('GITHUB')) throw new Error(`${label}: one source was starved`);
            for (let i = 1; i < items.length; i++) if (Date.parse(items[i-1].updatedAt) < Date.parse(items[i].updatedAt)) throw new Error(`${label}: recency order broken`);
          }
          console.log('HOME-6 source balance regression passed');
          NODE
          node /tmp/home6-source-balance-test.js

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git commit -m "HOME-6 Preserve both Recent Activity sources"
          git push origin HEAD:HOME-6-Add-combined-Recently-Active-widget
