name: Refresh GitHub PRs

on:
  pull_request:
    paths:
      - "dashboard/index.html"
      - "dashboard/refresh-health.js"
      - "dashboard/work-relationships.js"
      - "dashboard/github-prs.config.json"
      - "scripts/refresh-github-prs.mjs"
      - "scripts/verify-github-repository-coverage.mjs"
      - "scripts/test-dashboard-refresh.mjs"
      - "scripts/test-dashboard-work-relationships.mjs"
      - ".github/workflows/refresh-github-prs.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/work-relationships.js"
      - "dashboard/github-prs.config.json"
      - "scripts/refresh-github-prs.mjs"
      - "scripts/verify-github-repository-coverage.mjs"
      - "scripts/test-dashboard-work-relationships.mjs"
      - ".github/workflows/refresh-github-prs.yml"

permissions:
  contents: read

concurrency:
  group: github-prs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify refresh logic
        run: |
          node scripts/refresh-github-prs.mjs --self-test
          node scripts/verify-github-repository-coverage.mjs --self-test

      - name: Verify dashboard refresh health and work relationships
        run: |
          node --check dashboard/refresh-health.js
          node --check dashboard/work-relationships.js
          node --check scripts/test-dashboard-refresh.mjs
          node --check scripts/test-dashboard-work-relationships.mjs
          node scripts/test-dashboard-refresh.mjs
          node scripts/test-dashboard-work-relationships.mjs

      - name: Verify linked work browser presentation
        run: |
          cat > dashboard/home23-work-relationships.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              html, body { margin: 0; width: 390px; height: 900px; overflow: hidden; }
              iframe { display: block; width: 390px; height: 860px; border: 0; }
            </style>
          </head>
          <body>
            <iframe id="dashboard" src="./index.html"></iframe>
            <pre id="result">pending</pre>
            <script>
              const frame = document.getElementById('dashboard');
              frame.addEventListener('load', () => {
                const timer = window.setInterval(() => {
                  const api = frame.contentWindow.DashboardWorkRelationships;
                  if (!api) return;
                  window.clearInterval(timer);
                  const doc = frame.contentDocument;
                  doc.getElementById('flightRows').innerHTML = `
                    <a class="flight-row" href="https://example.atlassian.net/browse/HOME-19" target="_blank" rel="noopener noreferrer" aria-label="HOME-19 linked">
                      <div class="flight-cell flight-key">HOME-19</div><div class="flight-cell flight-summary">Linked ticket</div><div class="flight-cell flight-move">27 Aug 10:00</div><div class="flight-cell flight-status progress">In Progress</div>
                    </a>
                    <a class="flight-row" href="https://example.atlassian.net/browse/HOME-20" target="_blank" rel="noopener noreferrer" aria-label="HOME-20 unlinked">
                      <div class="flight-cell flight-key">HOME-20</div><div class="flight-cell flight-summary">Unlinked ticket</div><div class="flight-cell flight-move">27 Aug 09:00</div><div class="flight-cell flight-status todo">To Do</div>
                    </a>`;
                  doc.getElementById('githubRows').innerHTML = `
                    <a class="github-pr-row" href="https://github.com/benjamindrong/HomepageDashboard/pull/5" target="_blank" rel="noopener noreferrer" aria-label="HomepageDashboard pull request 5 linked">
                      <div class="github-pr-repo">HomepageDashboard <span class="github-pr-number">#5</span></div><div class="github-pr-title">HOME-19 Linked PR</div><div class="github-pr-updated">Updated 27 Aug 10:00</div><div class="github-pr-state review">Review</div>
                    </a>`;
                  doc.getElementById('recentRows').innerHTML = `
                    <a class="recent-row" href="https://example.atlassian.net/browse/HOME-19" target="_blank" rel="noopener noreferrer" aria-label="JIRA HOME-19 linked"><div class="recent-identity"><span class="recent-source-badge jira">JIRA</span> HOME-19</div><div class="recent-title">Linked ticket</div><div class="recent-updated">27 Aug 10:00</div></a>
                    <a class="recent-row" href="https://github.com/benjamindrong/HomepageDashboard/pull/5" target="_blank" rel="noopener noreferrer" aria-label="GITHUB HomepageDashboard #5 linked"><div class="recent-identity"><span class="recent-source-badge github">GITHUB</span> HomepageDashboard #5</div><div class="recent-title">HOME-19 Linked PR</div><div class="recent-updated">27 Aug 10:00</div></a>`;

                  api.render(
                    { issues: [
                      { key: 'HOME-19', url: 'https://example.atlassian.net/browse/HOME-19' },
                      { key: 'HOME-20', url: 'https://example.atlassian.net/browse/HOME-20' }
                    ] },
                    { pullRequests: [
                      { repository: 'benjamindrong/HomepageDashboard', number: 5, title: 'HOME-19 Linked PR', url: 'https://github.com/benjamindrong/HomepageDashboard/pull/5', state: 'OPEN' }
                    ] }
                  );

                  const linkedFlight = doc.querySelector('.flight-row[data-work-primary-url]');
                  const linkedGithub = doc.querySelector('.github-pr-row[data-work-primary-url]');
                  const linkedRecent = [...doc.querySelectorAll('.recent-row[data-work-primary-url]')];
                  const unlinkedFlight = doc.querySelector('.flight-row[href="https://example.atlassian.net/browse/HOME-20"]');
                  const counterpartLinks = [...doc.querySelectorAll('.work-counterpart-link')];
                  const hrefs = counterpartLinks.map(link => link.href);
                  const pass = Boolean(
                    linkedFlight && linkedGithub && linkedRecent.length === 2 && unlinkedFlight &&
                    counterpartLinks.length === 4 &&
                    hrefs.includes('https://github.com/benjamindrong/HomepageDashboard/pull/5') &&
                    hrefs.includes('https://example.atlassian.net/browse/HOME-19') &&
                    doc.querySelectorAll('a a').length === 0 &&
                    doc.documentElement.scrollWidth <= doc.documentElement.clientWidth
                  );
                  document.body.dataset.home23 = pass ? 'pass' : 'fail';
                  document.getElementById('result').textContent = JSON.stringify({
                    pass,
                    counterpartCount: counterpartLinks.length,
                    recentLinkedCount: linkedRecent.length,
                    unlinkedRemainedAnchor: Boolean(unlinkedFlight),
                    nestedAnchorCount: doc.querySelectorAll('a a').length,
                    scrollWidth: doc.documentElement.scrollWidth,
                    clientWidth: doc.documentElement.clientWidth
                  });
                }, 20);
              });
            </script>
          </body>
          </html>
          HTML

          python3 -m http.server 8000 >/tmp/home23-dashboard-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/dashboard/home23-work-relationships.html >/dev/null; then break; fi
            sleep 0.2
          done
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No supported headless Chrome/Chromium executable is available."
            exit 1
          fi
          "$browser" --headless --no-sandbox --disable-gpu --window-size=390,900 --virtual-time-budget=3000 --dump-dom \
            http://127.0.0.1:8000/dashboard/home23-work-relationships.html > /tmp/home23-work-relationships-dom.html
          grep -F 'data-home23="pass"' /tmp/home23-work-relationships-dom.html
          grep -F '"counterpartCount":4' /tmp/home23-work-relationships-dom.html
          grep -F '"recentLinkedCount":2' /tmp/home23-work-relationships-dom.html
          grep -F '"unlinkedRemainedAnchor":true' /tmp/home23-work-relationships-dom.html
          grep -F '"nestedAnchorCount":0' /tmp/home23-work-relationships-dom.html

      - name: Verify candidate diff
        run: |
          git fetch --no-tags origin main
          git diff --check FETCH_HEAD...HEAD

      - name: Verify live GitHub refresh for trusted owner PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor == github.repository_owner
        env:
          GITHUB_API_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN || github.token }}
          DASHBOARD_GITHUB_PRIVATE_REPOSITORIES: ${{ secrets.DASHBOARD_GITHUB_PRIVATE_REPOSITORIES }}
          DASHBOARD_DATA_PASSPHRASE: ${{ secrets.DASHBOARD_DATA_PASSPHRASE }}
          OUTPUT_PATH: /tmp/github-prs.enc.json
        run: |
          node scripts/refresh-github-prs.mjs
          node scripts/refresh-github-prs.mjs --verify-output "$OUTPUT_PATH"
          node scripts/verify-github-repository-coverage.mjs

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: dashboard-data-publish
      cancel-in-progress: false
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out encrypted data branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dashboard-data
          path: _dashboard-data

      - name: Refresh and verify encrypted GitHub PR snapshot
        env:
          GITHUB_API_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN || github.token }}
          DASHBOARD_GITHUB_PRIVATE_REPOSITORIES: ${{ secrets.DASHBOARD_GITHUB_PRIVATE_REPOSITORIES }}
          DASHBOARD_DATA_PASSPHRASE: ${{ secrets.DASHBOARD_DATA_PASSPHRASE }}
          PREVIOUS_PATH: _dashboard-data/dashboard/github-prs.enc.json
          OUTPUT_PATH: _dashboard-data/dashboard/github-prs.enc.json
        run: |
          node scripts/refresh-github-prs.mjs
          node scripts/refresh-github-prs.mjs --verify-output "$OUTPUT_PATH"
          node scripts/verify-github-repository-coverage.mjs

      - name: Publish changed snapshot
        working-directory: _dashboard-data
        env:
          DASHBOARD_DATA_PASSPHRASE: ${{ secrets.DASHBOARD_DATA_PASSPHRASE }}
          DASHBOARD_GITHUB_PRIVATE_REPOSITORIES: ${{ secrets.DASHBOARD_GITHUB_PRIVATE_REPOSITORIES }}
          CONFIG_PATH: ../dashboard/github-prs.config.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          owned_path=dashboard/github-prs.enc.json
          sibling_path=dashboard/jira-flight-control.enc.json
          baseline_owned_blob="$(git rev-parse "HEAD:$owned_path" 2>/dev/null || printf '<missing>')"
          git add "$owned_path"
          if git diff --cached --quiet; then
            echo "No GitHub PR changes."
            exit 0
          fi
          git commit -m "Refresh GitHub PR data"
          git fetch --no-tags origin dashboard-data
          remote_owned_blob="$(git rev-parse "FETCH_HEAD:$owned_path" 2>/dev/null || printf '<missing>')"
          if [ "$remote_owned_blob" != "$baseline_owned_blob" ]; then
            echo "dashboard-data $owned_path moved after acquisition; refusing to replay stale GitHub PR state."
            exit 1
          fi
          git rebase FETCH_HEAD
          test -f "$owned_path"
          test -f "$sibling_path"
          node ../scripts/refresh-github-prs.mjs --verify-output "$owned_path"
          git push origin HEAD:dashboard-data
