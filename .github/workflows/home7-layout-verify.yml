name: HOME-7 Layout Verification

on:
  push:
    branches:
      - HOME-7-Make-dashboard-resize-to-fit-browser-window
    paths:
      - ".github/home7-layout-verify-trigger.txt"

permissions:
  contents: read

jobs:
  verify-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source identity
        run: test "$(git hash-object dashboard/index.html)" = "3ac0b5640cffcb3a345870285002b9d97c650423"

      - name: Verify browser resize geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import json
          import re
          import shutil
          import subprocess
          import tempfile

          chrome = next((p for p in ('google-chrome', 'chromium', 'chromium-browser') if shutil.which(p)), None)
          if not chrome:
              raise SystemExit('Chrome/Chromium unavailable')

          source = Path('dashboard/index.html').read_text()
          probe = '''<script>
          (() => {
            const flight = document.querySelector('.flight-columns');
            const tickets = document.querySelector('.widget--tickets');
            const github = document.querySelector('.widget--github');
            const data = {
              innerWidth: window.innerWidth,
              innerHeight: window.innerHeight,
              documentScrollWidth: document.documentElement.scrollWidth,
              documentScrollHeight: document.documentElement.scrollHeight,
              flightClientWidth: flight.clientWidth,
              flightScrollWidth: flight.scrollWidth,
              ticketsTop: tickets.getBoundingClientRect().top,
              githubTop: github.getBoundingClientRect().top
            };
            document.documentElement.setAttribute('data-home7-metrics', JSON.stringify(data));
          })();
          </script>'''
          instrumented = source.replace('</body>', probe + '\n</body>', 1)

          with tempfile.TemporaryDirectory() as tmp:
              page = Path(tmp) / 'index.html'
              page.write_text(instrumented)
              for width in (800, 859, 860, 1024, 1440):
                  proc = subprocess.run([
                      chrome,
                      '--headless=new',
                      '--no-sandbox',
                      '--disable-gpu',
                      '--disable-dev-shm-usage',
                      '--no-first-run',
                      f'--window-size={width},900',
                      '--dump-dom',
                      page.as_uri(),
                  ], check=True, capture_output=True, text=True, timeout=30)
                  match = re.search(r'data-home7-metrics="([^"]+)"', proc.stdout)
                  if not match:
                      raise SystemExit(f'metrics missing at requested width {width}')
                  metrics = json.loads(html.unescape(match.group(1)))
                  actual_width = metrics['innerWidth']
                  if metrics['documentScrollWidth'] > actual_width:
                      raise SystemExit(f'horizontal page overflow at {actual_width}px: {metrics}')
                  if metrics['flightScrollWidth'] > metrics['flightClientWidth']:
                      raise SystemExit(f'Flight Control clips at {actual_width}px: {metrics}')
                  stacked = abs(metrics['ticketsTop'] - metrics['githubTop']) > 1
                  if actual_width <= 859 and not stacked:
                      raise SystemExit(f'widgets should stack at {actual_width}px: {metrics}')
                  if actual_width >= 860 and stacked:
                      raise SystemExit(f'widgets should share the top row at {actual_width}px: {metrics}')
                  if actual_width >= 860 and metrics['documentScrollHeight'] > metrics['innerHeight']:
                      raise SystemExit(f'desktop dashboard exceeds viewport height at {actual_width}px: {metrics}')
                  print(json.dumps(metrics, sort_keys=True))
          PY
