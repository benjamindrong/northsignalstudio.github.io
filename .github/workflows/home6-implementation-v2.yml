name: HOME-6 Implementation v2

on:
  push:
    branches:
      - HOME-6-Add-combined-Recently-Active-widget
    paths:
      - ".github/home6-trigger-v2.txt"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: HOME-6-Add-combined-Recently-Active-widget
          fetch-depth: 0

      - name: Apply HOME-6 production changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          jira_path = Path('scripts/refresh-jira-flight-control.mjs')
          jira = jira_path.read_text()
          replacements = [
            ("fields: ['summary', 'status', 'project']", "fields: ['summary', 'status', 'project', 'updated']"),
            ("for (const field of ['key', 'summary', 'status', 'statusCategory', 'projectKey', 'projectName', 'url']) {", "for (const field of ['key', 'summary', 'status', 'statusCategory', 'projectKey', 'projectName', 'updatedAt', 'url']) {"),
            ("if (issue.lastMove != null && Number.isNaN(Date.parse(issue.lastMove))) throw new Error(`Invalid LAST MOVE value for ${issue.key}.`);", "if (issue.lastMove != null && Number.isNaN(Date.parse(issue.lastMove))) throw new Error(`Invalid LAST MOVE value for ${issue.key}.`);\n    if (Number.isNaN(Date.parse(issue.updatedAt))) throw new Error(`Invalid updatedAt value for ${issue.key}.`);"),
            ("projectName: issue.fields?.project?.name || issue.fields?.project?.key || '',\n    lastMove:", "projectName: issue.fields?.project?.name || issue.fields?.project?.key || '',\n    updatedAt: issue.fields?.updated || '',\n    lastMove:"),
          ]
          for old, new in replacements:
            if jira.count(old) != 1: raise SystemExit(f'unexpected Jira preimage: {old!r}')
            jira = jira.replace(old, new)
          jira_path.write_text(jira)

          page_path = Path('dashboard/index.html')
          page = page_path.read_text()
          replacements = [
            ("""    .github-pr-state.unknown { color: var(--unknown); }\n\n    @media (min-width: 860px) and (min-height: 640px) {""", """    .github-pr-state.unknown { color: var(--unknown); }\n\n    .recent-board {\n      margin-top: 16px; min-width: 0; min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden;\n      border: 1px solid var(--board-line); background: var(--board-bg); color: var(--board-text);\n      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;\n    }\n    .recent-meta { min-width: 0; min-height: 34px; display: flex; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--board-line); background: var(--board-panel); }\n    .recent-source { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #a8aea8; font-size: 9px; letter-spacing: .055em; text-transform: uppercase; }\n    #recentRows { min-height: 0; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }\n    .recent-row { min-width: 0; min-height: 48px; display: grid; grid-template-columns: 120px minmax(0, 1fr) 112px; align-items: center; column-gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--board-line-soft); color: inherit; text-decoration: none; }\n    .recent-row:nth-child(even) { background: #121512; }\n    .recent-row:hover { background: #181d19; }\n    .recent-identity, .recent-title, .recent-updated { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }\n    .recent-identity { color: #fff7d3; font-size: 9px; font-weight: 900; }\n    .recent-source-badge { margin-right: 5px; border: 1px solid currentColor; padding: 2px 3px 1px; font-size: 7px; font-weight: 950; letter-spacing: .04em; text-transform: uppercase; }\n    .recent-source-badge.jira { color: var(--accent); }\n    .recent-source-badge.github { color: var(--review); }\n    .recent-title { font-size: 11px; font-weight: 750; }\n    .recent-updated { color: #9da59d; text-align: right; font-size: 8px; letter-spacing: .03em; text-transform: uppercase; }\n    .recent-empty { display: grid; min-height: 100%; place-items: center; padding: 18px; color: #9da59d; text-align: center; font-size: 10px; line-height: 1.45; letter-spacing: .04em; text-transform: uppercase; }\n\n    @media (min-width: 860px) and (min-height: 640px) {"""),
            ("""      .github-pr-row { min-height: 58px; padding-left: 6px; padding-right: 6px; column-gap: 5px; }\n      .github-pr-state { min-width: 68px; max-width: 76px; font-size: 7px; padding-left: 3px; padding-right: 3px; }""", """      .github-pr-row { min-height: 58px; padding-left: 6px; padding-right: 6px; column-gap: 5px; }\n      .github-pr-state { min-width: 68px; max-width: 76px; font-size: 7px; padding-left: 3px; padding-right: 3px; }\n      .recent-row { grid-template-columns: 86px minmax(0, 1fr) 72px; column-gap: 4px; padding-left: 6px; padding-right: 6px; }\n      .recent-source-badge { margin-right: 3px; font-size: 6px; padding-left: 2px; padding-right: 2px; }\n      .recent-identity { font-size: 8px; }\n      .recent-title { font-size: 10px; }\n      .recent-updated { font-size: 7px; }"""),
            ("""      <section class=\"widget widget--recent\" aria-labelledby=\"recent-title\">\n        <header class=\"widget-header\"><h2 id=\"recent-title\">Recently Active</h2></header>\n        <div class=\"widget-placeholder\"><p>Recently updated tickets and pull requests will appear here.</p></div>\n      </section>""", """      <section class=\"widget widget--recent\" aria-labelledby=\"recent-title\">\n        <header class=\"widget-header\"><h2 id=\"recent-title\">Recently Active</h2></header>\n        <div class=\"recent-board\" aria-label=\"Recently active Jira and GitHub work\">\n          <div class=\"recent-meta\"><div id=\"recentSource\" class=\"recent-source\">Encrypted Jira + GitHub feeds</div></div>\n          <div id=\"recentRows\"><div class=\"recent-empty\">Unlock the dashboard to load recent activity.</div></div>\n        </div>\n      </section>"""),
            ("""      const githubRowsEl = document.getElementById('githubRows');\n      const githubSourceEl = document.getElementById('githubSource');\n      const configPromises = new Map();""", """      const githubRowsEl = document.getElementById('githubRows');\n      const githubSourceEl = document.getElementById('githubSource');\n      const recentRowsEl = document.getElementById('recentRows');\n      const recentSourceEl = document.getElementById('recentSource');\n      const RECENT_ACTIVITY_LIMIT = 12;\n      const configPromises = new Map();"""),
            ("""      function renderGithubLocked(message = 'Unlock the dashboard to load pull requests.') {""", """      function recentTimestamp(value) {\n        const timestamp = Date.parse(value || '');\n        return Number.isNaN(timestamp) ? 0 : timestamp;\n      }\n\n      function recentActivityItems(jiraPayload, githubPayload) {\n        const jiraItems = (jiraPayload?.issues || []).map(issue => ({\n          source: 'JIRA', identity: issue.key || 'Issue', title: issue.summary || 'Untitled issue',\n          updatedAt: issue.updatedAt || issue.lastMove || '', url: issue.url || ''\n        }));\n        const githubItems = (githubPayload?.pullRequests || [])\n          .filter(pull => String(pull.state || '').toUpperCase() !== 'DRAFT')\n          .map(pull => {\n            const repository = String(pull.repository || 'Repository').split('/').pop() || 'Repository';\n            return { source: 'GITHUB', identity: `${repository} #${pull.number}`, title: pull.title || 'Untitled pull request', updatedAt: pull.updatedAt || '', url: pull.url || '' };\n          });\n        return [...jiraItems, ...githubItems]\n          .filter(item => item.url && recentTimestamp(item.updatedAt) > 0)\n          .sort((a, b) => recentTimestamp(b.updatedAt) - recentTimestamp(a.updatedAt) || a.source.localeCompare(b.source) || a.identity.localeCompare(b.identity))\n          .slice(0, RECENT_ACTIVITY_LIMIT);\n      }\n\n      function appendRecentRow(item) {\n        const row = document.createElement('a');\n        row.className = 'recent-row'; row.href = item.url; row.target = '_blank'; row.rel = 'noopener noreferrer';\n        row.setAttribute('aria-label', `${item.source} ${item.identity}: ${item.title}; updated ${formatDateTime(item.updatedAt)}`);\n        const identity = document.createElement('div'); identity.className = 'recent-identity';\n        const badge = document.createElement('span'); badge.className = `recent-source-badge ${item.source.toLowerCase()}`; badge.textContent = item.source;\n        identity.appendChild(badge); identity.append(document.createTextNode(` ${item.identity}`)); identity.title = `${item.source} · ${item.identity}`; row.appendChild(identity);\n        const title = document.createElement('div'); title.className = 'recent-title'; title.textContent = item.title; title.title = item.title; row.appendChild(title);\n        const updated = document.createElement('div'); updated.className = 'recent-updated'; updated.textContent = formatDateTime(item.updatedAt); updated.title = item.updatedAt; row.appendChild(updated);\n        recentRowsEl.appendChild(row);\n      }\n\n      function renderRecent(jiraPayload, githubPayload) {\n        recentRowsEl.replaceChildren();\n        const items = recentActivityItems(jiraPayload, githubPayload);\n        for (const item of items) appendRecentRow(item);\n        if (!items.length) {\n          const empty = document.createElement('div'); empty.className = 'recent-empty'; empty.textContent = 'No recent Jira or GitHub activity is available.'; recentRowsEl.appendChild(empty);\n        }\n        recentSourceEl.textContent = githubPayload ? 'Jira + GitHub · most recently updated' : 'Jira · GitHub feed unavailable';\n      }\n\n      function renderRecentLocked() {\n        recentRowsEl.innerHTML = '<div class=\"recent-empty\">Unlock the dashboard to load recent activity.</div>';\n        recentSourceEl.textContent = 'Encrypted Jira + GitHub feeds';\n      }\n\n      function renderGithubLocked(message = 'Unlock the dashboard to load pull requests.') {"""),
            ("""        lockEl.hidden = true;\n        renderGithubLocked();""", """        lockEl.hidden = true;\n        renderGithubLocked();\n        renderRecentLocked();"""),
            ("""          renderGithubLocked(message);\n        }\n      }""", """          renderGithubLocked(message);\n        }\n        renderRecent(jiraResult.value, githubResult.status === 'fulfilled' ? githubResult.value : null);\n      }"""),
          ]
          for old, new in replacements:
            if page.count(old) != 1: raise SystemExit(f'unexpected dashboard preimage: {old[:80]!r}')
            page = page.replace(old, new)
          page_path.write_text(page)
          PY

      - name: Run focused checks
        run: |
          node scripts/refresh-jira-flight-control.mjs --self-test
          node scripts/refresh-github-prs.mjs --self-test
          git diff --check

      - name: Verify Recently Active rendering and responsiveness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, json, re, shutil, subprocess, tempfile
          chrome = next((p for p in ('google-chrome', 'chromium', 'chromium-browser') if shutil.which(p)), None)
          if not chrome: raise SystemExit('Chrome/Chromium unavailable')
          source = Path('dashboard/index.html').read_text()
          marker = "document.getElementById('unlockForm').addEventListener('submit', onUnlock);"
          parts = source.rsplit(marker, 1)
          if len(parts) != 2: raise SystemExit('HOME-6 exposure marker missing')
          source = parts[0] + "window.__home6 = { renderRecent, recentActivityItems };\n      " + marker + parts[1]
          sample = '''<script>
          window.__home6.renderRecent(
            { issues: [
              { key:'HOME-6', summary:'Newest Jira item', updatedAt:'2026-08-13T20:00:00Z', lastMove:'2026-08-13T18:00:00Z', url:'https://example.test/jira/HOME-6' },
              { key:'MYR-1', summary:'Older Jira item', updatedAt:'2026-08-13T18:00:00Z', url:'https://example.test/jira/MYR-1' }
            ] },
            { pullRequests: [
              { repository:'benjamindrong/Runline', number:9, title:'Middle GitHub item', updatedAt:'2026-08-13T19:00:00Z', url:'https://example.test/github/9', state:'OPEN' },
              { repository:'benjamindrong/MyRAM-iOS', number:10, title:'Hidden draft', updatedAt:'2026-08-13T21:00:00Z', url:'https://example.test/github/10', state:'DRAFT' }
            ] }
          );
          document.documentElement.setAttribute('data-home6', JSON.stringify({
            rows:[...document.querySelectorAll('.recent-row')].map(row => ({text:row.textContent, href:row.href})),
            scrollWidth:document.documentElement.scrollWidth, innerWidth:window.innerWidth
          }));
          </script>'''
          source = source.replace('</body>', sample + '\n</body>', 1)
          with tempfile.TemporaryDirectory() as tmp:
            page = Path(tmp)/'index.html'; page.write_text(source)
            for width in (320,470,859,860,1440):
              proc = subprocess.run([chrome,'--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--no-first-run',f'--window-size={width},900','--dump-dom',page.as_uri()],check=True,capture_output=True,text=True,timeout=30)
              match = re.search(r'data-home6="([^"]+)"', proc.stdout)
              if not match: raise SystemExit(f'HOME-6 output missing at {width}px')
              data = json.loads(html.unescape(match.group(1))); rows = data['rows']
              expected = ['JIRA HOME-6','GITHUB Runline #9','JIRA MYR-1']
              if len(rows) != 3 or any(expected[i] not in rows[i]['text'] for i in range(3)): raise SystemExit(f'wrong order/source identity at {width}px: {rows}')
              if any('Hidden draft' in row['text'] for row in rows): raise SystemExit('draft PR leaked into Recently Active')
              if [row['href'] for row in rows] != ['https://example.test/jira/HOME-6','https://example.test/github/9','https://example.test/jira/MYR-1']: raise SystemExit(f'wrong links: {rows}')
              if data['scrollWidth'] > data['innerWidth']: raise SystemExit(f'horizontal overflow at {width}px: {data}')
              print(width, data)
          PY

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html scripts/refresh-jira-flight-control.mjs
          git commit -m "HOME-6 Add combined Recently Active widget"
          git push origin HEAD:HOME-6-Add-combined-Recently-Active-widget
