name: Validate dashboard theme

on:
  pull_request:
    paths:
      - dashboard/index.html
      - dashboard/display.html
      - dashboard/theme.css
      - dashboard/work-items.js
      - dashboard/benchmark-review.js
      - dashboard/work-relationships.js
      - scripts/test-dashboard-theme.mjs
      - scripts/test-dashboard-refresh.mjs
      - scripts/test-dashboard-work-items.mjs
      - scripts/test-dashboard-work-relationships.mjs
      - scripts/test-dashboard-work-items-browser.mjs
      - scripts/test-dashboard-work-items-browser.py
      - scripts/test-benchmark-review-disclosure-browser.py
      - .github/workflows/validate-dashboard-theme.yml
  push:
    branches:
      - main
    paths:
      - dashboard/index.html
      - dashboard/display.html
      - dashboard/theme.css
      - dashboard/work-items.js
      - dashboard/benchmark-review.js
      - dashboard/work-relationships.js
      - scripts/test-dashboard-theme.mjs
      - scripts/test-dashboard-refresh.mjs
      - scripts/test-dashboard-work-items.mjs
      - scripts/test-dashboard-work-relationships.mjs
      - scripts/test-dashboard-work-items-browser.mjs
      - scripts/test-dashboard-work-items-browser.py
      - scripts/test-benchmark-review-disclosure-browser.py
      - .github/workflows/validate-dashboard-theme.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-dashboard-theme.mjs
      - run: node scripts/test-dashboard-work-items.mjs
      - run: node scripts/test-dashboard-work-relationships.mjs
      - run: node scripts/test-dashboard-refresh.mjs

      - name: Verify Benchmark Review disclosure persistence
        run: python3 scripts/test-benchmark-review-disclosure-browser.py

      - name: Verify HOME-29 production-path compact layout
        shell: bash
        run: |
          set +e
          output="$(node scripts/test-dashboard-work-items-browser.mjs 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [[ "$output" != *"Could not parse browser result JSON:"* ]]; then
            exit "$status"
          fi
          echo "Retrying once after transient empty Chrome browser result."
          node scripts/test-dashboard-work-items-browser.mjs
