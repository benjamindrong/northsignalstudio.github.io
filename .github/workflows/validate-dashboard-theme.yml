name: Validate dashboard theme

on:
  pull_request:
    paths:
      - dashboard/index.html
      - dashboard/display.html
      - dashboard/theme.css
      - dashboard/benchmark-review.js
      - dashboard/work-relationships.js
      - scripts/test-dashboard-theme.mjs
      - .github/workflows/validate-dashboard-theme.yml
  push:
    branches:
      - main
    paths:
      - dashboard/index.html
      - dashboard/display.html
      - dashboard/theme.css
      - dashboard/benchmark-review.js
      - dashboard/work-relationships.js
      - scripts/test-dashboard-theme.mjs
      - .github/workflows/validate-dashboard-theme.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-dashboard-theme.mjs

      - name: Verify compact linked ticket layout
        run: |
          cat > dashboard/home23-mobile-layout.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              html, body { margin: 0; width: 390px; height: 900px; overflow: hidden; }
              iframe { display: block; width: 390px; height: 860px; border: 0; }
            </style>
          </head>
          <body>
            <iframe id="dashboard" src="./index.html"></iframe>
            <pre id="result">pending</pre>
            <script>
              const frame = document.getElementById('dashboard');
              frame.addEventListener('load', () => {
                const timer = window.setInterval(() => {
                  const doc = frame.contentDocument;
                  const api = frame.contentWindow?.DashboardWorkRelationships;
                  if (!doc?.getElementById('flightRows') || !api) return;
                  window.clearInterval(timer);

                  doc.getElementById('flightRows').innerHTML = `
                    <a class="flight-row" href="https://example.atlassian.net/browse/HOME-1234" target="_blank" rel="noopener noreferrer" aria-label="HOME-1234 linked">
                      <div class="flight-cell flight-key">HOME-1234</div>
                      <div class="flight-cell flight-summary">Keep linked ticket identity readable on mobile</div>
                      <div class="flight-cell flight-move">30 Aug 20:55</div>
                      <div class="flight-cell flight-status progress">In Progress</div>
                    </a>`;

                  api.render(
                    { issues: [{ key: 'HOME-1234', url: 'https://example.atlassian.net/browse/HOME-1234' }] },
                    { pullRequests: [{
                      repository: 'benjamindrong/northsignalstudio.github.io',
                      number: 7,
                      title: 'HOME-1234 Keep linked ticket identity readable on mobile',
                      url: 'https://github.com/benjamindrong/northsignalstudio.github.io/pull/7',
                      state: 'OPEN'
                    }] }
                  );

                  requestAnimationFrame(() => {
                    const keyLink = doc.querySelector('.flight-key .work-primary-link');
                    const counterpart = doc.querySelector('.flight-summary .work-counterpart-link');
                    const move = doc.querySelector('.flight-move .work-primary-link');
                    const keyFits = Boolean(keyLink && keyLink.scrollWidth <= keyLink.clientWidth);
                    const counterpartFits = Boolean(
                      counterpart && counterpart.textContent.trim() === '↔ #7' &&
                      counterpart.getBoundingClientRect().width > 0 &&
                      counterpart.scrollWidth <= counterpart.clientWidth
                    );
                    const moveFits = Boolean(move && move.scrollWidth <= move.clientWidth);
                    const noHorizontalOverflow = doc.documentElement.scrollWidth <= doc.documentElement.clientWidth;
                    const pass = keyFits && counterpartFits && moveFits && noHorizontalOverflow;

                    document.body.dataset.home23Mobile = pass ? 'pass' : 'fail';
                    document.getElementById('result').textContent = JSON.stringify({
                      pass,
                      keyFits,
                      counterpartFits,
                      moveFits,
                      noHorizontalOverflow,
                      keyClientWidth: keyLink?.clientWidth || 0,
                      keyScrollWidth: keyLink?.scrollWidth || 0,
                      counterpartClientWidth: counterpart?.clientWidth || 0,
                      counterpartScrollWidth: counterpart?.scrollWidth || 0,
                      moveClientWidth: move?.clientWidth || 0,
                      moveScrollWidth: move?.scrollWidth || 0
                    });
                  });
                }, 20);
              });
            </script>
          </body>
          </html>
          HTML

          python3 -m http.server 8000 >/tmp/home23-mobile-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/dashboard/home23-mobile-layout.html >/dev/null; then break; fi
            sleep 0.2
          done
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No supported headless Chrome/Chromium executable is available."
            exit 1
          fi
          "$browser" --headless --no-sandbox --disable-gpu --window-size=390,900 --virtual-time-budget=5000 --dump-dom \
            http://127.0.0.1:8000/dashboard/home23-mobile-layout.html > /tmp/home23-mobile-layout-dom.html
          grep -F 'data-home23-mobile="pass"' /tmp/home23-mobile-layout-dom.html
          grep -F '"keyFits":true' /tmp/home23-mobile-layout-dom.html
          grep -F '"counterpartFits":true' /tmp/home23-mobile-layout-dom.html
          grep -F '"moveFits":true' /tmp/home23-mobile-layout-dom.html
          grep -F '"noHorizontalOverflow":true' /tmp/home23-mobile-layout-dom.html
